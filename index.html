<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        function isWsError(msg) {
          if (!msg) return false;
          var str = typeof msg === 'string' ? msg : (msg.message || msg.stack || String(msg));
          return str.indexOf('WebSocket') !== -1 ||
                 str.indexOf('websocket') !== -1 ||
                 str.indexOf('closed without opened') !== -1 ||
                 str.indexOf('failed to connect to websocket') !== -1 ||
                 (str.indexOf('[vite]') !== -1 && str.indexOf('ws') !== -1);
        }

        var origError = console.error;
        console.error = function() {
          var str = '';
          for (var i = 0; i < arguments.length; i++) {
            var a = arguments[i];
            str += ' ' + (a && (a.message || a.stack || (typeof a === 'object' ? JSON.stringify(a) : String(a))));
          }
          if (isWsError(str)) return;
          origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          var str = '';
          for (var i = 0; i < arguments.length; i++) {
            var a = arguments[i];
            str += ' ' + (a && (a.message || a.stack || (typeof a === 'object' ? JSON.stringify(a) : String(a))));
          }
          if (isWsError(str)) return;
          origWarn.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(e) {
          if (isWsError(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(e) {
          if (isWsError(e.message) || isWsError(e.error)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          function MockWebSocket(url, protocols) {
            var isViteHmr = typeof url === 'string' && (
              url.indexOf('vite') !== -1 ||
              url.indexOf('localhost') !== -1 ||
              url.indexOf('3000') !== -1 ||
              protocols === 'vite-hmr'
            );
            if (isViteHmr) {
              var listeners = {};
              var self = {
                url: url,
                readyState: 1,
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                send: function() {},
                close: function() {},
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                  }
                },
                dispatchEvent: function(event) {
                  var fns = listeners[event.type] || [];
                  fns.forEach(function(fn) { fn.call(self, event); });
                  return true;
                },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
              };
              setTimeout(function() {
                var ev = { type: 'open' };
                if (typeof self.onopen === 'function') self.onopen(ev);
                self.dispatchEvent(ev);
                setTimeout(function() {
                  var msgEv = { type: 'message', data: JSON.stringify({ type: 'connected' }) };
                  if (typeof self.onmessage === 'function') self.onmessage(msgEv);
                  self.dispatchEvent(msgEv);
                }, 20);
              }, 10);
              return self;
            }
            return new NativeWebSocket(url, protocols);
          }
          MockWebSocket.CONNECTING = 0;
          MockWebSocket.OPEN = 1;
          MockWebSocket.CLOSING = 2;
          MockWebSocket.CLOSED = 3;
          MockWebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket = MockWebSocket;
        }
      })();
    </script>
    <title>Trợ Lý Chủ Nhiệm AI</title>
    <meta name="description" content="Quản lý lớp học thông minh, nhẹ việc chủ nhiệm mỗi ngày dành cho giáo viên tiểu học." />
    <meta property="og:title" content="Trợ Lý Chủ Nhiệm AI" />
    <meta property="og:description" content="Quản lý lớp học thông minh, nhẹ việc chủ nhiệm mỗi ngày dành cho giáo viên tiểu học." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>

</html>
